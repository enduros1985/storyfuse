services:
  - type: web
    name: storyfuse-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://jocular-chimera-c7d695.netlify.app
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1565804224019955742"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_PUBLIC_KEY
        value: be14578d3371fe3061fbf6ccfa7631863bdec2232b49cf93c3747495b8ecb8c0
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "None"
