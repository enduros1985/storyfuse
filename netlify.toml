[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://storyfuse-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://storyfuse-api.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://storyfuse-api.onrender.com/socket.io/:splat"
  status = 200
  force = true
